server:
  port: 8086
spring:
  datasource:
    url: ${BOOSTA_DB_URL:jdbc:mysql://localhost:3306/ecosystem_boost?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BOOSTA_DB_USERNAME:root}
    password: ${BOOSTA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${BOOSTA_JPA_DDL_AUTO:update}
    open-in-view: false
boosta:
  auth:
    jwt-secret: ${BOOSTA_AUTH_JWT_SECRET:}
    bootstrap-secret: ${BOOSTA_AUTH_BOOTSTRAP_SECRET:}
    service-secret: ${BOOSTA_AUTH_SERVICE_SECRET:}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
