spring:
  application:
    name: customer-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: ${BOOSTA_DB_URL:jdbc:mysql://localhost:3306/ecosystem_boost?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BOOSTA_DB_USERNAME:root}
    password: ${BOOSTA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${BOOSTA_JPA_DDL_AUTO:update}
    open-in-view: false
server:
  port: 8083
boosta:
  auth:
    jwt-secret: ${BOOSTA_AUTH_JWT_SECRET:}
integrations:
  data-warehouse:
    base-url: ${BOOSTA_DWH_BASE_URL:}
    api-key: ${BOOSTA_DWH_API_KEY:}
  reconciliation:
    identifier: ${BOOSTA_RECONCILIATION_IDENTIFIER:}
    secret: ${BOOSTA_RECONCILIATION_SECRET:}
drawdowns:
  confirmation-poll-interval: ${BOOSTA_DRAWDOWN_CONFIRMATION_POLL_INTERVAL:30000}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
