spring:
  application:
    name: portfolio-service
  config:
    import: optional:configserver:http://localhost:8888
integrations:
  scoring:
    base-url: ${BOOSTA_SCORING_BASE_URL:}
    api-key: ${BOOSTA_SCORING_API_KEY:}
boosta:
  auth:
    jwt-secret: ${BOOSTA_AUTH_JWT_SECRET:}
server:
  port: 8091
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
